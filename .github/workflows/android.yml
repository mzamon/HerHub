name: Android validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Create CI Firebase configuration
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "herhub-ci",
              "storage_bucket": "herhub-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "za.co.herhub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyHerHubCiPlaceholder000000000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Run unit tests
        run: ./gradlew check
      - name: Build debug APK
        run: ./gradlew assembleDebug
